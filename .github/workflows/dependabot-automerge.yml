name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: dependabot-automerge
    # actor check: stop if someone else pushed to the Dependabot branch.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # Minor/patch only; majors wait for review. fetch-metadata calls 0.x bumps like
      # 0.7 -> 0.10 "minor" although they break, while Dependabot itself treats them as major
      # and keeps them out of the *-minor-patch groups, so trust the group, not update-type.
      # Terraform is excluded because merging to main auto-applies infrastructure.
      # --auto waits for the ruleset's required check (ci-ok).
      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.package-ecosystem != 'terraform' &&
          (endsWith(steps.meta.outputs.dependency-group, '-minor-patch') ||
          steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Merges made with GITHUB_TOKEN don't trigger the push workflows (Build & Release,
          # Deploy Landing). A PAT stored as the Dependabot secret AUTOMERGE_TOKEN fixes that.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
