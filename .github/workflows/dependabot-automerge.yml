name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: dependabot-automerge
    # Not github.actor: a "@dependabot rebase" comment makes the commenter the actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # Every update type, majors included: --auto only merges once the ruleset's required
      # check (ci-ok) passes, so a breaking bump stays open with red CI.
      # Terraform is excluded because merging to main auto-applies infrastructure.
      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem != 'terraform'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Merges made with GITHUB_TOKEN don't trigger the push workflows (Build & Release,
          # Deploy Landing). A PAT stored as the Dependabot secret AUTOMERGE_TOKEN fixes that.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
