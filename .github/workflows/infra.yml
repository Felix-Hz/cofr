name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ap-southeast-2
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN || '' }}

jobs:
  plan:
    name: infra-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes || 'false' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Terraform plans happily with these empty and only fails at apply; catch it here.
      - name: Check required configuration
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN TF_VAR_cloudflare_zone_id; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Set the matching repository secret or variable (see infra/terraform/README.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -input=false
      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          terraform show -no-color tfplan > tfplan.txt
          {
            echo "### Terraform plan"
            echo
            echo "$(grep -E '^(Plan:|No changes\.)' tfplan.txt || echo 'No changes.')"
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```hcl'
            head -c 60000 tfplan.txt
            echo '```'
            echo '</details>'
          } > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            const body = `${marker}\n${fs.readFileSync("infra/terraform/plan.md", "utf8")}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt

  apply:
    name: infra-apply
    if: >-
      github.event_name != 'pull_request' &&
      needs.plan.outputs.has_changes == 'true'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: terraform init
        run: terraform init -input=false
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
