name: CI

on:
  pull_request:

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      scribe: ${{ steps.filter.outputs.scribe }}
      postgres: ${{ steps.filter.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Any workflow change runs everything, so GitHub Actions bumps are exercised too.
          filters: |
            server:
              - 'apps/server/**'
              - 'apps/scribe/**'
              - 'infra/*'
              - 'scripts/**'
              - '.github/workflows/**'
            client:
              - 'apps/client/**'
              - 'infra/*'
              - 'scripts/**'
              - '.github/workflows/**'
            scribe:
              - 'apps/scribe/**'
              - '.github/workflows/**'
            postgres:
              - 'infra/docker/postgres/**'
              - 'scripts/restore_db_from_s3.sh'
              - '.github/workflows/**'

  server:
    name: lint-test-build / server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  client:
    name: lint-test-build / client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  scribe:
    name: lint-test / scribe
    needs: changes
    if: needs.changes.outputs.scribe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scribe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
      - run: cargo test

  docker-build-server:
    name: image-build / server
    needs: server
    if: needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          build-contexts: |
            scribe=./apps/scribe
          push: false

  docker-build-client:
    name: image-build / client
    needs: client
    if: needs.client.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/client
          push: false

  docker-build-postgres:
    name: image-build / postgres
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/postgres/Dockerfile
          push: false

  # Single always-reporting check for the main ruleset to require. The jobs above are
  # path-filtered, so any of them may be skipped; this fails only if one actually failed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [changes, server, client, scribe, docker-build-server, docker-build-client, docker-build-postgres]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required CI jobs passed or were skipped."

