name: Deploy Landing

on:
  push:
    branches:
      - main
    paths:
      - "apps/client/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: landing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy / landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    env:
      BUCKET: ${{ vars.LANDING_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - name: Build static landing page
        env:
          VITE_LANDING: "1"
        run: |
          bun run build
          find build/client -name "*.map" -delete
          cp landing/sw.js build/client/sw.js

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LANDING_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        run: |
          # Hashed assets never change; HTML is cached at the edge until the invalidation below.
          aws s3 sync build/client/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync build/client "s3://$BUCKET" \
            --exclude "assets/*" --exclude "*.html" --exclude "sw.js" \
            --cache-control "public, max-age=3600"
          aws s3 cp build/client/sw.js "s3://$BUCKET/sw.js" \
            --cache-control "no-cache"
          aws s3 sync build/client "s3://$BUCKET" \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
          aws s3 sync build/client "s3://$BUCKET" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LANDING_DISTRIBUTION_ID }}" \
            --paths "/*"
